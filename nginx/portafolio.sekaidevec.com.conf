server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name portafolio.sekaidevec.com _;

    client_max_body_size 10M;

    # Serve public static files directly (models, draco, favicon, etc.)
    location /models/ {
        alias /opt/SekaiDevEC/frontend/public/models/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        sendfile on;
        tcp_nopush on;
    }

    location /draco/ {
        alias /opt/SekaiDevEC/frontend/public/draco/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        sendfile on;
        tcp_nopush on;
    }

    # Serve Next.js production static assets directly
    location /_next/static/ {
        alias /opt/SekaiDevEC/frontend/.next/static/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        sendfile on;
        tcp_nopush on;
    }

    # Proxy Next.js app with proper WebSocket upgrade handling
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade only when requested
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /api {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
